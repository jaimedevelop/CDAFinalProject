<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="950" viewBox="0 0 1600 950">
  <defs>
    <marker id="arrow-data" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#1764c8"/>
    </marker>
    <marker id="arrow-control" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#cc2e2e"/>
    </marker>
    <marker id="arrow-clock" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#7440a8"/>
    </marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #111; }
      .title { font-size: 26px; font-weight: 700; }
      .subtitle { font-size: 15px; fill: #333; }
      .block-title { font-size: 18px; font-weight: 700; }
      .block-sub { font-size: 14px; fill: #333; }
      .label { font-size: 13px; font-weight: 600; }
      .small { font-size: 12px; fill: #333; }
      .fpga { fill: #fbfdff; stroke: #333; stroke-width: 2; stroke-dasharray: 9 7; }
      .codec { fill: #fff6df; stroke: #333; stroke-width: 2; }
      .clock { fill: #eef0f5; stroke: #777; stroke-width: 1.6; }
      .config { fill: #ffeceb; stroke: #cc2e2e; stroke-width: 1.7; }
      .logic { fill: #e8f2ff; stroke: #1764c8; stroke-width: 1.9; }
      .memory { fill: #edf8ef; stroke: #21834a; stroke-width: 1.9; }
      .data { stroke: #1764c8; stroke-width: 2.4; fill: none; marker-end: url(#arrow-data); }
      .control { stroke: #cc2e2e; stroke-width: 2.2; fill: none; marker-end: url(#arrow-control); }
      .clockline { stroke: #7440a8; stroke-width: 2.1; stroke-dasharray: 7 6; fill: none; marker-end: url(#arrow-clock); }
      .data-text { fill: #0f4b9b; }
      .control-text { fill: #a52525; }
      .clock-text { fill: #5b2f86; }
    </style>
  </defs>

  <rect x="0" y="0" width="1600" height="950" fill="#fff"/>

  <text x="800" y="42" text-anchor="middle" class="title">Kaushik - Audio Codec &amp; Hardware Integration Block Diagram</text>
  <text x="800" y="70" text-anchor="middle" class="subtitle">SSM2603 codec configuration, serial audio conversion, sample path selection, volume control, and recorder/playback handshakes</text>

  <rect x="230" y="120" width="1085" height="690" rx="10" class="fpga"/>
  <text x="255" y="150" class="block-title">Anvyl FPGA / sound_system_top.v</text>

  <!-- External codec -->
  <rect x="45" y="355" width="150" height="190" rx="6" class="codec"/>
  <text x="120" y="410" text-anchor="middle" class="block-title">SSM2603</text>
  <text x="120" y="435" text-anchor="middle" class="block-title">Audio Codec IC</text>
  <text x="120" y="475" text-anchor="middle" class="block-sub">Mic input</text>
  <text x="120" y="498" text-anchor="middle" class="block-sub">Speaker output</text>

  <!-- Clock lane -->
  <rect x="290" y="190" width="250" height="92" rx="6" class="clock"/>
  <text x="415" y="222" text-anchor="middle" class="block-title">Project Clock Wizard</text>
  <text x="415" y="247" text-anchor="middle" class="block-sub">37.5 MHz mem_sys_clk</text>
  <text x="415" y="270" text-anchor="middle" class="block-sub">to clk_cpu / clk_codec_ref</text>

  <rect x="650" y="190" width="250" height="92" rx="6" class="clock"/>
  <text x="775" y="222" text-anchor="middle" class="block-title">Codec Clock Wizard</text>
  <text x="775" y="247" text-anchor="middle" class="block-sub">clk_codec_ref</text>
  <text x="775" y="270" text-anchor="middle" class="block-sub">to clk_audio / clk_codec_main</text>

  <rect x="1010" y="190" width="235" height="92" rx="6" class="config"/>
  <text x="1128" y="222" text-anchor="middle" class="block-title">Top Control Inputs</text>
  <text x="1128" y="247" text-anchor="middle" class="block-sub">sys_rst</text>
  <text x="1128" y="270" text-anchor="middle" class="block-sub">monitor, tone, volume[3:0]</text>

  <!-- Logic lane -->
  <rect x="290" y="410" width="230" height="130" rx="6" class="config"/>
  <text x="405" y="448" text-anchor="middle" class="block-title">I2C_AV_CONFIG.v</text>
  <text x="405" y="474" text-anchor="middle" class="block-sub">I2C_CONTROLLER.v</text>
  <text x="405" y="499" text-anchor="middle" class="block-sub">codec register setup</text>
  <text x="405" y="523" text-anchor="middle" class="block-sub">codec_init_status[3:0]</text>

  <rect x="630" y="400" width="265" height="150" rx="6" class="logic"/>
  <text x="762" y="439" text-anchor="middle" class="block-title">AUDIO_CODEC.v</text>
  <text x="762" y="467" text-anchor="middle" class="block-sub">serial audio interface</text>
  <text x="762" y="493" text-anchor="middle" class="block-sub">LRCK / BCLK / ADC / DAC</text>
  <text x="762" y="519" text-anchor="middle" class="block-sub">parallel sample conversion</text>

  <rect x="1015" y="380" width="260" height="190" rx="6" class="logic"/>
  <text x="1145" y="420" text-anchor="middle" class="block-title">AUDIO_SAMPLE_PATH.v</text>
  <text x="1145" y="450" text-anchor="middle" class="block-sub">record/playback bridge</text>
  <text x="1145" y="477" text-anchor="middle" class="block-sub">volume scaling</text>
  <text x="1145" y="504" text-anchor="middle" class="block-sub">monitor + test tone select</text>
  <text x="1145" y="531" text-anchor="middle" class="block-sub">DAC sample source priority</text>

  <rect x="1390" y="398" width="170" height="152" rx="6" class="memory"/>
  <text x="1475" y="438" text-anchor="middle" class="block-title">Recorder /</text>
  <text x="1475" y="463" text-anchor="middle" class="block-title">Memory Controller</text>
  <text x="1475" y="502" text-anchor="middle" class="block-sub">Person 2 interface</text>
  <text x="1475" y="526" text-anchor="middle" class="block-sub">RAM-backed samples</text>

  <!-- Clock signals, routed above blocks -->
  <path d="M230 236 H290" class="clockline"/>
  <text x="246" y="222" class="label clock-text">mem_sys_clk</text>

  <path d="M540 236 H650" class="clockline"/>
  <text x="565" y="222" class="label clock-text">clk_codec_ref</text>

  <path d="M775 282 V340 H762 V400" class="clockline"/>
  <text x="787" y="334" class="label clock-text">clk_audio</text>

  <path d="M700 282 V335 H405 V410" class="clockline"/>
  <text x="495" y="323" class="label clock-text">clk_codec_main</text>

  <path d="M840 190 V122 H120 V355" class="clockline"/>
  <text x="145" y="112" class="label clock-text">aud_xck to SSM2603</text>

  <path d="M1128 282 V380" class="control"/>
  <text x="1142" y="337" class="label control-text">sys_rst + mode controls</text>

  <!-- I2C codec configuration -->
  <path d="M290 446 H195" class="control"/>
  <text x="205" y="431" class="label control-text">aud_i2c_sclk</text>
  <path d="M290 506 H195" class="control"/>
  <text x="205" y="530" class="label control-text">aud_i2c_sdat</text>

  <!-- Serial audio pins, separated into their own lanes -->
  <path d="M630 438 H195" class="data"/>
  <text x="335" y="423" class="label data-text">ADC side: AUD_ADCLRCK, AUD_ADCDAT</text>

  <path d="M630 515 H195" class="data"/>
  <text x="315" y="548" class="label data-text">DAC side: AUD_DACLRCK, AUD_DACDAT, AUD_BCLK</text>

  <!-- Parallel codec/sample path interface -->
  <path d="M895 430 H1015" class="data"/>
  <text x="920" y="416" class="label data-text">adc_sample[15:0]</text>

  <path d="M1015 472 H895" class="data"/>
  <text x="915" y="494" class="label data-text">dac_sample[15:0]</text>

  <path d="M895 535 H1015" class="control"/>
  <text x="910" y="560" class="label control-text">aud_sample_end[1], aud_sample_req[1]</text>

  <!-- Recorder/memory interface, using three clean lanes -->
  <path d="M1275 418 H1390" class="data"/>
  <text x="1287" y="403" class="label data-text">rec_sample_data[15:0]</text>

  <path d="M1275 468 H1390" class="control"/>
  <text x="1287" y="455" class="label control-text">rec_sample_valid, rec_sample_tog</text>

  <path d="M1390 512 H1275" class="data"/>
  <text x="1288" y="535" class="label data-text">pb_sample_data[15:0]</text>

  <path d="M1390 562 H1295 V550 H1275" class="control"/>
  <text x="1285" y="592" class="label control-text">pb_path_en, latched_vol[3:0], pb_req_tog</text>

  <!-- Legend -->
  <rect x="375" y="690" width="780" height="86" rx="7" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="405" y="723" class="block-sub">Legend:</text>
  <line x1="500" y1="718" x2="580" y2="718" class="data"/>
  <text x="600" y="723" class="small">Data/sample buses</text>
  <line x1="735" y1="718" x2="815" y2="718" class="control"/>
  <text x="835" y="723" class="small">Control/status signals</text>
  <line x1="980" y1="718" x2="1060" y2="718" class="clockline"/>
  <text x="1080" y="723" class="small">Clock/reset signals</text>
  <text x="405" y="758" class="small">Person 1 files shown: AUDIO_CODEC.v, AUDIO_SAMPLE_PATH.v, I2C_AV_CONFIG.v, I2C_CONTROLLER.v</text>
</svg>
